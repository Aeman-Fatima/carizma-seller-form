<app-car-loader *ngIf="isLoading"></app-car-loader>
<div class="row m-0">
  <div class="col-12 col-sm-12 col-md-12 col-lg-12 d-flex align-items-center">
    <div class="car-header class.mat-elevation-z8 ">
      Instant Cash Offer for your
      {{
      " " +
      selectVechileDetails?.year +
      " " +
      selectVechileDetails?.make +
      " " +
      selectVechileDetails?.model
      }}
    </div>
  </div>
</div>

      <div #animatedElement>

      <mat-progress-bar  mode="determinate" value={{this.stepperNumber}}></mat-progress-bar>
     
    </mat-step>
   
   
    <mat-step label="Contact Information">
      <app-seller-contact (contactStepValidation)="validateStepperOne($event)"></app-seller-contact>
      <div
        _ngcontent-my-app-c41=""

      >
        <div _ngcontent-my-app-c41="" class="col-6 d-flex m-0 p-0">
          <button
            _ngcontent-my-app-c41=""
            class="secondary-cta mr-auto"
            fdprocessedid="lef4y2"
          >
            Back
          </button>
        </div>
        <div _ngcontent-my-app-c41="" class="col-6 d-flex m-0 p-0">

      <mat-divider></mat-divider>

            <button mat-raised-button matStepperPrevious  class="previousBtn" (click)="prevStep(2)">Back</button>
          </div>
          <div class="col-6 d-flex m-0 mt-3 p-0 d-flex justify-content-end">
            <!-- <button class="btn ml-auto btn-next" (click)="nextStep(3)">

            <button (click)="nextStep(3)" class="nextBtn border" >Next</button>
          </div>
        </div>

    <mat-step label="Review">
      <app-review-page (reviewPageValidated)="validateStepperOne($event)"></app-review-page>
      <mat-divider></mat-divider>
      <div class="w-100">
        <div class="row m-0">
          <div class="col-6 d-flex m-0 mt-3 p-0">
            <button mat-raised-button matStepperPrevious  class="previousBtn" (click)="prevStep(3)">Back</button>
         
          </div>
          <div class="col-6 d-flex m-0 mt-3 p-0 d-flex justify-content-end">
            <button (click)="nextStep(4)" class="nextBtn border">Submit</button>
         
          </div>
        </div>
      </div>
    </mat-step>
    <mat-step label="Instant Offer">
      <app-seller-instant-offer [callAPI]="instantOfferAPICall" [srcImages]="srcImages"></app-seller-instant-offer>
